<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotiBat — Download</title>
<meta name="description" content="Download SpotiBat, the native Android music client with offline downloads.">
<meta property="og:title" content="SpotiBat — Download">
<meta property="og:description" content="Native Android music client with offline playback. Get the latest APK.">
<meta property="og:image" content="shots/home.jpg">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #121212;
    color: #fff;
    position: relative;
    min-height: 100%;
    padding: 4rem 1.5rem 3rem;
  }

  /* Logo watermark background — fixed, centered, faded, gently breathing */
  .logo-bg {
    position: fixed;
    inset: 0;
    background: url("icon.png") center 42% / min(72vmin, 560px) no-repeat;
    opacity: 0.10;
    filter: saturate(1.1);
    pointer-events: none;
    user-select: none;
  }

  /* Soft vignette so text stays readable over the watermark */
  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(18, 18, 18, 0.55) 75%, rgba(18, 18, 18, 0.9) 100%);
    pointer-events: none;
  }

  .hero {
    position: relative;
    z-index: 1;
    text-align: center;
    margin: 0 auto;
    max-width: 34rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
  }

  .logo {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .tagline {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    color: rgba(255, 255, 255, 0.65);
    line-height: 1.5;
    max-width: 28rem;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.65rem;
    margin-top: 0.6rem;
    padding: 1rem 2.2rem;
    background: #1db954;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 999px;
    border: none;
    box-shadow: 0 8px 30px rgba(29, 185, 84, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .download-btn:hover {
    background: #1ed760;
    transform: translateY(-2px);
    box-shadow: 0 12px 38px rgba(29, 185, 84, 0.5);
  }

  .download-btn:active { transform: translateY(0); }

  .download-btn svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

  .meta {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.45);
    min-height: 1.3em;
  }

  .alt-link {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.4);
    text-decoration: none;
    border-bottom: 1px dotted rgba(255, 255, 255, 0.3);
  }

  .alt-link:hover { color: rgba(255, 255, 255, 0.7); }

  .requirements {
    margin-top: 0.8rem;
    font-size: 0.78rem;
    color: rgba(255, 255, 255, 0.35);
  }

  /* Screenshots */
  .shots {
    position: relative;
    z-index: 1;
    margin: 3.5rem auto 0;
    max-width: 72rem;
  }

  .shots-title {
    text-align: center;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    margin-bottom: 1.6rem;
  }

  .shot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 1.4rem;
    align-items: start;
  }

  figure.shot { margin: 0; }

  .phone {
    border-radius: 22px;
    overflow: hidden;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .phone img { display: block; width: 100%; height: auto; }

  figure.shot:hover .phone {
    transform: translateY(-4px);
    box-shadow: 0 24px 54px rgba(0, 0, 0, 0.65);
  }

  figcaption {
    margin-top: 0.7rem;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.75);
  }

  figcaption span {
    display: block;
    margin-top: 0.15rem;
    font-weight: 400;
    font-size: 0.78rem;
    color: rgba(255, 255, 255, 0.4);
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-top: 3rem;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.3);
  }

  @media (prefers-reduced-motion: no-preference) {
    .logo-bg { animation: breathe 9s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.10; transform: scale(1); }
      50%      { opacity: 0.16; transform: scale(1.025); }
    }
  }

  @media (max-width: 520px) {
    body { padding: 2.5rem 1.1rem 2rem; }
    .shot-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
  }
</style>
</head>
<body>
  <div class="logo-bg" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="hero">
    <img class="logo" src="icon.png" alt="SpotiBat logo" width="96" height="96">

    <h1>SpotiBat</h1>

    <p class="tagline">
      Your music, your rules. A native Android client that streams your library
      and keeps the songs you love on the device, ready with no connection.
    </p>

    <a class="download-btn"
       href="https://github.com/Pro-mwas1234/SpotiBat/releases/latest/download/SpotiBat-latest.apk"
       download>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v10.586l-3.293-3.293-1.414 1.414L12 16.414l4.707-4.707-1.414-1.414L12 13.586V3h-1.5zM5 19h14v2H5v-2z" transform="translate(0,-1.5)"/>
      </svg>
      <span id="btnLabel">Download for Android</span>
    </a>

    <p class="meta" id="meta"></p>

    <a class="alt-link" href="https://github.com/Pro-mwas1234/SpotiBat/releases" target="_blank" rel="noopener">
      All releases
    </a>

    <p class="requirements">Requires Android 7.0 (Nougat) or newer</p>
  </main>

  <section class="shots" aria-label="SpotiBat screenshots">
    <p class="shots-title">A look inside</p>
    <div class="shot-grid">
      <figure class="shot">
        <div class="phone">
          <img src="shots/home.jpg" alt="SpotiBat home screen with playlists and recently played songs" loading="lazy" width="360" height="800">
        </div>
        <figcaption>Home<span>Playlists, songs and your artists</span></figcaption>
      </figure>

      <figure class="shot">
        <div class="phone">
          <img src="shots/player.jpg" alt="SpotiBat now playing screen with artwork and controls" loading="lazy" width="360" height="800">
        </div>
        <figcaption>Now playing<span>Artwork, lyrics and playback</span></figcaption>
      </figure>

      <figure class="shot">
        <div class="phone">
          <img src="shots/lib.jpg" alt="SpotiBat downloads list showing songs saved offline with their sizes" loading="lazy" width="360" height="800">
        </div>
        <figcaption>Offline<span>Downloaded songs, kept as plain files</span></figcaption>
      </figure>

      <figure class="shot">
        <div class="phone">
          <img src="shots/settings.jpg" alt="SpotiBat settings with storage location and playback options" loading="lazy" width="360" height="800">
        </div>
        <figcaption>Settings<span>Choose where songs are stored</span></figcaption>
      </figure>
    </div>
  </section>

  <footer>© 2026 SpotiBat Team</footer>

<script>
(function () {
  // The button itself is a plain link to GitHub's stable redirect URL
  // (releases/latest/download/SpotiBat-latest.apk) — it works with zero
  // API calls. The API is used only opportunistically to show the
  // version and file size on the label; if it fails, nothing breaks.
  var API = "https://api.github.com/repos/Pro-mwas1234/SpotiBat/releases/latest";

  fetch(API, { headers: { Accept: "application/vnd.github+json" } })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (release) {
      if (!release) return;
      var assets = (release.assets || []).filter(function (a) {
        return /^SpotiBat-latest\.apk$/i.test(a.name);
      });
      if (!assets.length) return;
      var rawTag = release.tag_name || "latest";
      var tag = rawTag.replace(/^v/i, "");
      document.getElementById("btnLabel").textContent =
        "Download v" + tag + " · " + (assets[0].size / 1048576).toFixed(1) + " MB";
      document.getElementById("meta").textContent =
        "Latest release: v" + tag;
    })
    .catch(function () { /* silent — the plain link already works */ });
})();
</script>
</body>
</html>
