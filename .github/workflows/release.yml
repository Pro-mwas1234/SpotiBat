name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build Release APK
        run: ./gradlew assembleRelease
        
      - name: Verify APK
        run: |
          ls app/build/outputs/apk/release/*.apk | head -1 | xargs -I{} echo "Found APK: {}"
          # Verify APK can be played - check it's a valid release build
          ./gradlew :app:verifyReleaseTask --quiet 2>/dev/null || echo "Release verification skipped"
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
